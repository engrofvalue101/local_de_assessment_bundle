name: 'local_de_assessment'
version: '1.0.0'
config-version: 2

profile: 'local_duckdb'

model-paths: ['models']
snapshot-paths: ['snapshots']
test-paths: ['tests']
analysis-paths: ['analysis']
macro-paths: ['macros']
seed-paths: ['seeds']
target-path: 'target'
clean-targets: ['target']
tests:
  +store_failures: true  # Store all failed test results
  +schema: dbt_test_failures  # Custom schema for failures
models:
  local_de_assessment:
    
    staging:
      +schema: stg
      materialized: view  
      #+contract:
        #enforced: true           # Only staging has contracts
    
    silver:
      +schema: silver
    
    gold:
      +schema: gold