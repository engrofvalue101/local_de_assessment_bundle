version: 2

models:
  - name: stg_customers
    description: Staging layer for customers - light cleaning only
    columns:
      - name: customer_id
        description: Primary key
        tests:
          - not_null
          - unique
      - name: email
        tests:
          - not_null
          - valid_email  # Custom test

  - name: stg_orders
    description: Staging layer for orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: status
        tests:
          - accepted_values:
              values: ['PENDING', 'PROCESSING', 'SHIPPED', 'DELIVERED', 'CANCELLED']

  - name: stg_order_lines
    description: Staging layer for order line items
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - line_number
    columns:
      - name: quantity
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: unit_price
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: stg_stores
    columns:
      - name: store_id
        tests:
          - not_null
          - unique
      - name: latitude
        tests:
          - valid_latitude  # Custom test: -90 to 90
      - name: longitude
        tests:
          - valid_longitude  # Custom test: -180 to 180

  - name: stg_suppliers
    columns:
      - name: supplier_id
        tests:
          - not_null
          - unique

  - name: stg_shipments
    columns:
      - name: shipment_id
        tests:
          - not_null
          - unique

  - name: stg_sensors
    columns:
      - name: reading_id
        tests:
          - not_null
          - unique