      - name: open_dt
        data_type: date
        description: "Date when store opened"

      - name: close_dt
        data_type: date
        description: "Date when store closed"

      # QUALITY FLAGS
      - name: has_null_store_id
        data_type: boolean
        description: "Flag: store_id is null (based on staging unique/not_null test)"

      - name: has_null_store_code
        data_type: boolean
