      - name: has_future_open_date
        data_type: boolean
        description: "Flag: open_dt is in the future"

      - name: is_valid_record
        data_type: boolean
        description: "Overall validity flag - TRUE if passes all quality checks"
        tests:
          - not_null

      - name: quality_issue_type
        data_type: varchar
        description: "Description of quality issue if invalid"

      - name: ingestion_ts
        data_type: timestamp with time zone
        description: "Timestamp when data was ingested"

      - name: transformed_at
        data_type: timestamp with time zone
        description: "Timestamp when record was transformed in silver layer"

  - name: silver_suppliers
    description: "Enriched supplier/vendor data with quality validation flags"
    columns:
