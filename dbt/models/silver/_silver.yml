version: 2

models:
  # ==========================================================================
  # INTERMEDIATE MODELS (Minimal - only where needed)
  # ==========================================================================
  
  - name: int_order_lines_enriched
    description: "Order lines with calculated amounts - used for order aggregation"
    config:
      materialized: view
    columns:
      - name: order_id
        description: "Foreign key to orders"
        tests:
          - not_null
      - name: line_number
        description: "Line sequence number"
        tests:
          - not_null
      - name: product_id
        description: "Foreign key to products"
      - name: qty
        description: "Quantity ordered"
      - name: unit_price
        description: "Price per unit"
      - name: line_discount_pct
        description: "Discount percentage (0-1)"
      - name: tax_pct
        description: "Tax percentage (0-1)"
      - name: gross_amount
        description: "qty * unit_price"
      - name: discount_amount
        description: "gross_amount * line_discount_pct"
      - name: net_amount
        description: "gross_amount - discount_amount"
      - name: tax_amount
        description: "net_amount * tax_pct"
      - name: line_total
        description: "net_amount + tax_amount"
      - name: has_invalid_qty
        description: "Flag for qty <= 0"
      - name: has_invalid_price
        description: "Flag for unit_price <= 0"
      - name: has_invalid_discount
        description: "Flag for discount outside 0-100%"
      - name: is_valid_line
        description: "Overall validity flag (qty>0, price>0, discount 0-100%)"
      - name: ingestion_ts
        description: "Source ingestion timestamp"

  # ==========================================================================
  # SILVER DIMENSION MODELS
  # ==========================================================================

  - name: silver_customers
    description: "Cleaned, deduplicated, and enriched customer dimension"
    config:
      schema: silver
      materialized: table
    columns:
      - name: customer_id
        description: "Surrogate key from source system"
        tests:
          - unique
          - not_null
      - name: natural_key
        description: "Business key (CUST-XXXXXXXX)"
        tests:
          - unique
          - not_null
      - name: first_name
        description: "Customer first name"
      - name: last_name
        description: "Customer last name"
      - name: email
        description: "Customer email address"
      - name: phone
        description: "Customer phone number"
      - name: address_line1
        description: "Street address line 1"
      - name: address_line2
        description: "Street address line 2"
      - name: city
        description: "City"
      - name: state_region
        description: "State or region"
      - name: postcode
        description: "Postal code"
      - name: country_code
        description: "ISO country code"
      - name: latitude
        description: "Geographic latitude"
      - name: longitude
        description: "Geographic longitude"
      - name: birth_date
        description: "Customer date of birth"
      - name: join_ts
        description: "Timestamp when customer joined"
      - name: is_vip
        description: "VIP status flag"
      - name: gdpr_consent
        description: "GDPR consent flag"
      - name: customer_age
        description: "Age calculated from birth_date"
      - name: customer_lifetime_days
        description: "Days since customer joined"
      - name: age_group
        description: "Age bracket: Under 18, 18-24, 25-34, 35-44, 45-54, 55-64, 65+, Unknown"
      - name: customer_segment
        description: "VIP/Regular × New/Long Term"
      - name: ingestion_ts
        description: "Source ingestion timestamp"
      - name: transformed_at
        description: "Timestamp when transformation occurred"

  - name: silver_products
    description: "Cleaned, deduplicated, and enriched product dimension"
    config:
      schema: silver
      materialized: table
    columns:
      - name: product_id
        description: "Surrogate key from source system"
        tests:
          - unique
          - not_null
      - name: sku
        description: "Business key (SKU-XXXXXX)"
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Product name"
      - name: category
        description: "Product category"
      - name: subcategory
        description: "Product subcategory"
      - name: current_price
        description: "Current product price"
      - name: currency
        description: "Currency code"
      - name: is_discontinued
        description: "Discontinued flag"
      - name: introduced_dt
        description: "Date product was introduced"
      - name: discontinued_dt
        description: "Date product was discontinued"
      - name: product_age_days
        description: "Days since product was introduced"
      - name: product_lifespan_days
        description: "Days from introduction to discontinuation (if discontinued)"
      - name: price_tier
        description: "Budget, Economy, Mid-Range, Premium, Luxury"
      - name: lifecycle_stage
        description: "New, Current, Mature, Discontinued"
      - name: ingestion_ts
        description: "Source ingestion timestamp"
      - name: transformed_at
        description: "Timestamp when transformation occurred"

  - name: silver_stores
    description: "Cleaned, deduplicated, and enriched store dimension"
    config:
      schema: silver
      materialized: table
    columns:
      - name: store_id
        description: "Surrogate key from source system"
        tests:
          - unique
          - not_null
      - name: store_code
        description: "Business key"
        tests:
          - unique
          - not_null
      - name: store_name
        description: "Store name"
      - name: channel
        description: "Store channel"
      - name: region
        description: "Store region"
      - name: state
        description: "State"
      - name: latitude
        description: "Geographic latitude"
      - name: longitude
        description: "Geographic longitude"
      - name: open_dt
        description: "Store opening date"
      - name: close_dt
        description: "Store closing date (if closed)"
      - name: store_age_days
        description: "Days since store opened"
      - name: store_status
        description: "Active or Closed"
      - name: operational_days
        description: "Total days store has been operational"
      - name: store_size_category
        description: "Large, Medium, Small based on region"
      - name: ingestion_ts
        description: "Source ingestion timestamp"
      - name: transformed_at
        description: "Timestamp when transformation occurred"

  - name: silver_suppliers
    description: "Cleaned, deduplicated, and enriched supplier dimension"
    config:
      schema: silver
      materialized: table
    columns:
      - name: supplier_id
        description: "Surrogate key from source system"
        tests:
          - unique
          - not_null
      - name: supplier_code
        description: "Business key"
        tests:
          - unique
          - not_null
      - name: supplier_name
        description: "Supplier name"
      - name: country_code
        description: "ISO country code"
      - name: lead_time_days
        description: "Lead time in days"
      - name: preferred
        description: "Preferred supplier flag"
      - name: lead_time_category
        description: "Express, Standard, Extended, Long Lead"
      - name: supplier_tier
        description: "Tier 1-5 based on preferred status and lead time"
      - name: supplier_region
        description: "Oceania, North America, Europe, Asia, Other"
      - name: ingestion_ts
        description: "Source ingestion timestamp"
      - name: transformed_at
        description: "Timestamp when transformation occurred"

  - name: silver_exchange_rates
    description: "Daily exchange rates with rate changes"
    config:
      schema: silver
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - rate_date
            - currency
    columns:
      - name: rate_date
        description: "Date for exchange rate"
        tests:
          - not_null
      - name: currency
        description: "Currency code"
        tests:
          - not_null
      - name: rate_to_aud
        description: "Exchange rate from currency to AUD"
      - name: aud_to_currency_rate
        description: "Inverse rate (AUD to currency)"
      - name: day_of_week
        description: "Day of week (0=Sunday)"
      - name: is_business_day
        description: "True for Monday-Friday"
      - name: rate_year
        description: "Year of rate"
      - name: rate_month
        description: "Month of rate"
      - name: ingestion_ts
        description: "Source ingestion timestamp"
      - name: transformed_at
        description: "Timestamp when transformation occurred"
      - name: prev_day_rate
        description: "Previous day's rate for this currency"
      - name: rate_change
        description: "Absolute change from previous day"
      - name: rate_change_pct
        description: "Percentage change from previous day"

  # ==========================================================================
  # SILVER FACT MODELS (Incremental)
  # ==========================================================================

  - name: silver_orders
    description: "Order header fact with aggregated line totals"
    config:
      schema: silver
      materialized: incremental
      unique_key: order_id
    columns:
      - name: order_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to customers"
      - name: store_id
        description: "Foreign key to stores"
      - name: order_ts
        description: "Order timestamp"
      - name: order_dt_local
        description: "Order date in local timezone"
      - name: channel
        description: "Order channel"
      - name: payment_method
        description: "Payment method used"
      - name: coupon_code
        description: "Coupon code applied"
      - name: shipping_fee
        description: "Shipping fee charged"
      - name: currency
        description: "Currency code"
      - name: line_count
        description: "Number of lines in order"
      - name: unique_product_count
        description: "Number of distinct products"
      - name: total_quantity
        description: "Total quantity across all lines"
      - name: order_gross_amount
        description: "Sum of line gross amounts"
      - name: order_discount_amount
        description: "Sum of line discounts"
      - name: order_net_amount
        description: "Sum of line net amounts"
      - name: order_tax_amount
        description: "Sum of line taxes"
      - name: order_subtotal
        description: "Sum of line totals"
      - name: order_total
        description: "Order subtotal + shipping fee"
      - name: order_hour
        description: "Hour of day (0-23)"
      - name: order_day_of_week
        description: "Day of week (0=Sunday)"
      - name: is_weekend
        description: "True if Saturday or Sunday"
      - name: has_coupon
        description: "True if coupon code applied"
      - name: ingestion_ts
        description: "Source ingestion timestamp"
      - name: transformed_at
        description: "Timestamp when transformation occurred"

  - name: silver_order_lines
    description: "Order line fact with product context and calculated amounts"
    config:
      schema: silver
      materialized: incremental
      unique_key: ['order_id', 'line_number']
    columns:
      - name: order_id
        description: "Foreign key to orders"
        tests:
          - not_null
      - name: line_number
        description: "Line sequence number"
        tests:
          - not_null
      - name: product_id
        description: "Foreign key to products"
      - name: customer_id
        description: "Foreign key to customers"
      - name: store_id
        description: "Foreign key to stores"
      - name: order_ts
        description: "Order timestamp"
      - name: order_dt_local
        description: "Order date in local timezone"
      - name: channel
        description: "Order channel"
      - name: currency
        description: "Currency code"
      - name: qty
        description: "Quantity ordered"
      - name: unit_price
        description: "Price per unit"
      - name: line_discount_pct
        description: "Discount percentage (0-1)"
      - name: tax_pct
        description: "Tax percentage (0-1)"
      - name: gross_amount
        description: "qty * unit_price"
      - name: discount_amount
        description: "Discount applied to line"
      - name: net_amount
        description: "After discount"
      - name: tax_amount
        description: "Tax on net amount"
      - name: line_total
        description: "Final line amount"
      - name: category
        description: "Product category"
      - name: subcategory
        description: "Product subcategory"
      - name: price_tier
        description: "Product price tier"
      - name: discount_band
        description: "No Discount, 1-10%, 11-25%, 26-50%, Over 50%"
      - name: quantity_band
        description: "Single Unit, Small Batch, Medium Batch, Bulk Order"
      - name: ingestion_ts
        description: "Source ingestion timestamp"
      - name: transformed_at
        description: "Timestamp when transformation occurred"

  - name: silver_shipments
    description: "Shipment tracking fact with delivery metrics"
    config:
      schema: silver
      materialized: incremental
      unique_key: shipment_id
    columns:
      - name: shipment_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to orders"
      - name: customer_id
        description: "Foreign key to customers"
      - name: store_id
        description: "Foreign key to stores"
      - name: order_ts
        description: "Order timestamp"
      - name: order_dt_local
        description: "Order date in local timezone"
      - name: channel
        description: "Order channel"
      - name: currency
        description: "Currency code"
      - name: qty
        description: "Quantity ordered"
      - name: unit_price
        description: "Price per unit"
      - name: line_discount_pct
        description: "Discount percentage (0-1)"
      - name: tax_pct
        description: "Tax percentage (0-1)"
      - name: gross_amount
        description: "qty * unit_price"
      - name: discount_amount
        description: "Discount applied to line"
      - name: net_amount
        description: "After discount"
      - name: tax_amount
        description: "Tax on net amount"
      - name: line_total
        description: "Final line amount"
      - name: category
        description: "Product category"
      - name: subcategory
        description: "Product subcategory"
      - name: price_tier
        description: "Product price tier"
      - name: discount_band
        description: "No Discount, 1-10%, 11-25%, 26-50%, Over 50%"
      - name: quantity_band
        description: "Single Unit, Small Batch, Medium Batch, Bulk Order"
      - name: ingestion_ts
        description: "Source ingestion timestamp"
      - name: transformed_at
        description: "Timestamp when transformation occurred"

  - name: silver_returns
    description: "Product return fact with timing and reason analysis"
    config:
      schema: silver
      materialized: incremental
      unique_key: return_id
    columns:
      - name: return_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to orders"
      - name: product_id
        description: "Foreign key to products"
      - name: customer_id
        description: "Foreign key to customers"
      - name: store_id
        description: "Foreign key to stores"
      - name: return_ts
        description: "Return timestamp"
      - name: return_date
        description: "Return date"
      - name: return_qty
        description: "Quantity returned"
      - name: return_reason
        description: "Raw return reason text"
      - name: order_ts
        description: "Original order timestamp"
      - name: order_dt_local
        description: "Original order date in local timezone"
      - name: category
        description: "Product category"
      - name: subcategory
        description: "Product subcategory"
      - name: days_to_return
        description: "Days from order to return"
      - name: return_category
        description: "Defective, Wrong Item, Size Issue, Changed Mind, Quality Issue, Other"
      - name: return_window
        description: "Within 1 Week, 2 Weeks, 1 Month, After 1 Month"
      - name: ingestion_ts
        description: "Source ingestion timestamp"
      - name: transformed_at
        description: "Timestamp when transformation occurred"

  - name: silver_sensors
    description: "Sensor readings with anomaly detection (detail level)"
    config:
      schema: silver
      materialized: incremental
      unique_key: ['store_id', 'shelf_id', 'sensor_ts']
    columns:
      - name: sensor_ts
        description: "Sensor reading timestamp"
        tests:
          - not_null
      - name: sensor_date
        description: "Sensor reading date"
      - name: store_id
        description: "Foreign key to stores"
        tests:
          - not_null
      - name: shelf_id
        description: "Shelf identifier"
        tests:
          - not_null
      - name: temperature_c
        description: "Temperature in Celsius"
      - name: humidity_pct
        description: "Humidity percentage"
      - name: battery_mv
        description: "Battery level in millivolts"
      - name: has_temperature_anomaly
        description: "True if temperature outside -20 to 50°C"
      - name: has_humidity_anomaly
        description: "True if humidity outside 10-95%"
      - name: battery_level
        description: "Critical, Low, Medium, Good"
      - name: temperature_range
        description: "Below Freezing, Cold, Cool, Optimal, Warm, Hot"
      - name: humidity_range
        description: "Dry, Optimal, Humid, Very Humid"
      - name: ingestion_ts
        description: "Source ingestion timestamp"
      - name: transformed_at
        description: "Timestamp when transformation occurred"

  - name: silver_events
    description: "User event tracking with categorization"
    config:
      schema: silver
      materialized: incremental
      unique_key: event_id
    columns:
      - name: event_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Foreign key to customers (nullable for anonymous)"
      - name: session_id
        description: "Session identifier"
      - name: event_ts
        description: "Event timestamp"
      - name: event_date
        description: "Event date"
      - name: event_type
        description: "page_view, click, add_to_cart, etc."
      - name: detail_path
        description: "Detail or path associated with event"
      - name: meta_x
        description: "Additional metadata"
      - name: event_hour
        description: "Hour of day (0-23)"
      - name: event_day_of_week
        description: "Day of week (0=Sunday)"
      - name: is_weekend
        description: "True if Saturday or Sunday"
      - name: event_category
        description: "Browse, Cart, Conversion, Search, Other"
      - name: user_type
        description: "Registered or Anonymous"
      - name: ingestion_ts
        description: "Source ingestion timestamp"
      - name: transformed_at
        description: "Timestamp when transformation occurred"