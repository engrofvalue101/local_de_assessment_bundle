version: 2

models:
  # ==========================================================================
  # SILVER MODELS - Data Quality Pattern
  # ==========================================================================
  # All silver models include validation flags based on staging tests
  # Pattern: is_valid_record flag + individual quality flags
  # This allows us to keep ALL data while filtering for quality downstream
  # ==========================================================================

  - name: silver_customers
    description: "Enriched customer data with quality validation flags. All data is preserved with is_valid_record flag for downstream filtering."
    columns:
      - name: customer_id
        data_type: bigint
        description: "Surrogate key"
        tests:
          - unique
          - not_null

      - name: natural_key
        data_type: varchar
        description: "Natural business key"
        tests:
          - unique
          - not_null

      - name: email
        data_type: varchar
        description: "Customer email address"

      - name: latitude
        data_type: double
        description: "Geographical latitude"

      - name: longitude
        data_type: double
        description: "Geographical longitude"

      # QUALITY FLAGS
      - name: has_null_customer_id
        data_type: boolean
        description: "Flag: customer_id is null (based on staging not_null test)"

      - name: has_null_natural_key
        data_type: boolean
        description: "Flag: natural_key is null (based on staging unique/not_null test)"

      - name: has_invalid_email_format
        data_type: boolean
        description: "Flag: email format is invalid (based on staging email_format test)"

      - name: has_invalid_latitude_range
        data_type: boolean
        description: "Flag: latitude out of range -90 to 90 (based on staging latitude_range test)"

      - name: has_invalid_longitude_range
        data_type: boolean
        description: "Flag: longitude out of range -180 to 180 (based on staging longitude_range test)"

      - name: is_valid_record
        data_type: boolean
        description: "Overall validity flag - TRUE if passes all quality checks, FALSE otherwise"
        tests:
          - not_null

      - name: quality_issue_type
        data_type: varchar
        description: "Description of quality issue if invalid, NULL if valid"

      - name: ingestion_ts
        data_type: timestamp with time zone
        description: "Timestamp when data was ingested"

      - name: transformed_at
        data_type: timestamp with time zone
        description: "Timestamp when record was transformed in silver layer"

  - name: silver_events
    description: "Enriched event tracking data with quality validation flags and incremental loading via state table"
    columns:
      - name: event_id
        data_type: varchar
        description: "Unique event identifier"
        tests:
          - unique
          - not_null

      - name: event_ts
        data_type: timestamp with time zone
        description: "Event timestamp"
        tests:
          - not_null

      - name: event_type
        data_type: varchar
        description: "Type of event"
        tests:
          - not_null

      - name: user_id
        data_type: bigint
        description: "Foreign key to customers"

      # QUALITY FLAGS
      - name: has_invalid_user_relationship
        data_type: boolean
        description: "Flag: user_id doesn't exist in customers (based on staging relationships test)"

      - name: has_null_event_id
        data_type: boolean
        description: "Flag: event_id is null"

      - name: has_null_event_ts
        data_type: boolean
        description: "Flag: event_ts is null"

      - name: has_null_event_type
        data_type: boolean
        description: "Flag: event_type is null"

      - name: has_future_timestamp
        data_type: boolean
        description: "Flag: event_ts is in the future"

      - name: is_valid_record
        data_type: boolean
        description: "Overall validity flag - TRUE if passes all quality checks"
        tests:
          - not_null

      - name: quality_issue_type
        data_type: varchar
        description: "Description of quality issue if invalid"

      - name: ingestion_ts
        data_type: timestamp with time zone
        description: "Timestamp when data was ingested"

  - name: silver_orders
    description: "Enriched order data with quality validation flags and incremental loading via state table"
    columns:
      - name: order_id
        data_type: bigint
        description: "Unique order identifier"
        tests:
          - unique
          - not_null

      - name: customer_id
        data_type: bigint
        description: "Foreign key to customers"
        tests:
          - not_null

      - name: order_ts
        data_type: timestamp with time zone
        description: "Order timestamp"
        tests:
          - not_null

      # QUALITY FLAGS
      - name: has_null_order_id
        data_type: boolean
        description: "Flag: order_id is null (based on staging not_null test)"

      - name: has_null_customer_id
        data_type: boolean
        description: "Flag: customer_id is null (based on staging not_null test)"

      - name: has_null_order_ts
        data_type: boolean
        description: "Flag: order_ts is null"

      - name: has_future_order_ts
        data_type: boolean
        description: "Flag: order_ts is in the future"

      - name: has_invalid_customer_relationship
        data_type: boolean
        description: "Flag: customer_id doesn't exist in customers (based on staging relationships test)"

      - name: has_invalid_store_relationship
        data_type: boolean
        description: "Flag: store_id doesn't exist in stores (based on staging relationships test)"

      - name: is_valid_record
        data_type: boolean
        description: "Overall validity flag - TRUE if passes all quality checks"
        tests:
          - not_null

      - name: quality_issue_type
        data_type: varchar
        description: "Description of quality issue if invalid"

      - name: ingestion_ts
        data_type: timestamp with time zone
        description: "Timestamp when data was ingested"

  - name: silver_order_lines
    description: "Enriched order line data with quality validation flags and incremental loading via state table"
    columns:
      - name: order_id
        data_type: bigint
        description: "Foreign key to orders"
        tests:
          - not_null

      - name: line_number
        data_type: integer
        description: "Line number within order"
        tests:
          - not_null

      - name: product_id
        data_type: bigint
        description: "Foreign key to products"
        tests:
          - not_null

      - name: line_discount_pct
        data_type: decimal(5,4)
        description: "Discount percentage (0 to 1)"

      # QUALITY FLAGS
      - name: has_null_order_id
        data_type: boolean
        description: "Flag: order_id is null (based on staging not_null test)"

      - name: has_null_product_id
        data_type: boolean
        description: "Flag: product_id is null (based on staging not_null test)"

      - name: has_invalid_discount_range
        data_type: boolean
        description: "Flag: line_discount_pct out of range 0-1 (based on staging discount_percentage_range test)"

      - name: has_invalid_order_relationship
        data_type: boolean
        description: "Flag: order_id doesn't exist in orders (based on staging relationships test)"

      - name: has_invalid_product_relationship
        data_type: boolean
        description: "Flag: product_id doesn't exist in products (based on staging relationships test)"

      - name: has_invalid_quantity
        data_type: boolean
        description: "Flag: qty is null or <= 0"

      - name: has_invalid_unit_price
        data_type: boolean
        description: "Flag: unit_price is null or < 0"

      - name: is_valid_record
        data_type: boolean
        description: "Overall validity flag - TRUE if passes all quality checks"
        tests:
          - not_null

      - name: quality_issue_type
        data_type: varchar
        description: "Description of quality issue(s) if invalid"

      - name: ingestion_ts
        data_type: timestamp with time zone
        description: "Timestamp when data was ingested"

  - name: silver_shipments
    description: "Enriched shipment data with quality validation flags and incremental loading via state table"
    columns:
