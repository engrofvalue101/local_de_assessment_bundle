        description: "Flag: current_price is negative"

      - name: has_discontinued_before_introduced
        data_type: boolean
        description: "Flag: discontinued_dt is before introduced_dt (logical error)"

      - name: has_discontinued_without_date
        data_type: boolean
        description: "Flag: is_discontinued is TRUE but discontinued_dt is NULL"

      - name: is_valid_record
        data_type: boolean
        description: "Overall validity flag - TRUE if passes all quality checks"
        tests:
          - not_null

      - name: quality_issue_type
        data_type: varchar
