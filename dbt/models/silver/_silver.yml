      - name: has_invalid_order_relationship
        data_type: boolean
        description: "Flag: order_id doesn't exist in orders (based on staging relationships test)"

      - name: has_delivered_before_shipped
        data_type: boolean
        description: "Flag: delivered_at is before shipped_at (logical error)"

      - name: has_future_shipped_at
        data_type: boolean
        description: "Flag: shipped_at is in the future"

      - name: has_future_delivered_at
        data_type: boolean
        description: "Flag: delivered_at is in the future"

      - name: is_valid_record
        data_type: boolean
        description: "Overall validity flag - TRUE if passes all quality checks"
        tests:
          - not_null

      - name: quality_issue_type
        data_type: varchar
        description: "Description of quality issue if invalid"

      - name: ingestion_ts
        data_type: timestamp with time zone
        description: "Timestamp when data was ingested"

  - name: silver_returns
    description: "Enriched return data with quality validation flags and incremental loading via state table"
    columns:
      - name: return_id
        data_type: bigint
        description: "Unique return identifier"
        tests:
          - unique
          - not_null

      - name: order_id
        data_type: bigint
        description: "Foreign key to orders"
        tests:
          - not_null

      - name: product_id
        data_type: bigint
        description: "Foreign key to products"
        tests:
          - not_null

      # QUALITY FLAGS
      - name: has_null_return_id
        data_type: boolean
        description: "Flag: return_id is null"

      - name: has_null_order_id
        data_type: boolean
        description: "Flag: order_id is null"

      - name: has_null_product_id
        data_type: boolean
        description: "Flag: product_id is null"

      - name: has_null_return_ts
        data_type: boolean
        description: "Flag: return_ts is null"

      - name: has_invalid_order_relationship
        data_type: boolean
        description: "Flag: order_id doesn't exist in orders (based on staging relationships test)"

      - name: has_invalid_product_relationship
        data_type: boolean
        description: "Flag: product_id doesn't exist in products (based on staging relationships test)"

      - name: has_invalid_quantity
        data_type: boolean
        description: "Flag: qty is null or <= 0"

      - name: has_future_return_ts
        data_type: boolean
        description: "Flag: return_ts is in the future"

      - name: is_valid_record
        data_type: boolean
        description: "Overall validity flag - TRUE if passes all quality checks"
        tests:
          - not_null

      - name: quality_issue_type
        data_type: varchar
        description: "Description of quality issue if invalid"

      - name: ingestion_ts
        data_type: timestamp with time zone
        description: "Timestamp when data was ingested"

  - name: silver_sensors
    description: "Enriched sensor data with quality validation flags and incremental loading via state table"
    columns:
      - name: sensor_ts
        data_type: timestamp with time zone
        description: "Sensor reading timestamp"
        tests:
          - not_null

      - name: store_id
        data_type: bigint
        description: "Foreign key to stores"
        tests:
          - not_null

      - name: shelf_id
        data_type: varchar
        description: "Shelf identifier"
        tests:
          - not_null

      - name: temperature_c
        data_type: decimal(5,2)
        description: "Temperature in Celsius"

      - name: humidity_pct
        data_type: decimal(5,2)
        description: "Humidity percentage"

      - name: battery_mv
        data_type: integer
        description: "Battery level in millivolts"

      # QUALITY FLAGS
      - name: has_null_sensor_ts
        data_type: boolean
        description: "Flag: sensor_ts is null"

      - name: has_null_store_id
        data_type: boolean
        description: "Flag: store_id is null"

      - name: has_null_shelf_id
        data_type: boolean
        description: "Flag: shelf_id is null"

      - name: has_invalid_store_relationship
        data_type: boolean
        description: "Flag: store_id doesn't exist in stores (based on staging relationships test)"

      - name: has_extreme_temperature_anomaly
        data_type: boolean
        description: "Flag: temperature_c outside range -50 to 80 (sensor malfunction)"

      - name: has_extreme_humidity_anomaly
        data_type: boolean
        description: "Flag: humidity_pct outside range 0 to 100 (sensor malfunction)"

      - name: has_extreme_battery_anomaly
        data_type: boolean
        description: "Flag: battery_mv outside range 0 to 5000 (sensor malfunction)"

      - name: has_future_sensor_ts
        data_type: boolean
        description: "Flag: sensor_ts is in the future"

      - name: has_temperature_anomaly
        data_type: boolean
        description: "Flag: temperature_c outside operational range -20 to 50 (monitoring alert)"

      - name: has_humidity_anomaly
        data_type: boolean
        description: "Flag: humidity_pct outside operational range 10 to 95 (monitoring alert)"

      - name: is_valid_record
        data_type: boolean
        description: "Overall validity flag - TRUE if passes all critical quality checks"
        tests:
          - not_null

      - name: quality_issue_type
        data_type: varchar
        description: "Description of quality issue if invalid"

      - name: ingestion_ts
        data_type: timestamp with time zone
        description: "Timestamp when data was ingested"

